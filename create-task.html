<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project | Task Management</title>
    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<header>
    <nav>
        <a href="index.html">
            <img src="assets/taskflows-logo.png" alt="TaskFlows" width="200">
        </a>
        <ul>
            <li><a href="dashboard.html" id="">Dashboard</a></li>
            <li><a href="tasks.html" id="">Tasks</a></li>
            <li><a href="" id="logout">Logout</a></li>
        </ul>
        <button id="menu-toggle" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </nav>
</header>

<body>
    <section id="main">
        <h1>Create New Task</h1>
        <p id="success"></p>
        <form id="create-task" method="POST">
            <label for="task-content" class="form-label">Task Description</label>
            <input type="text" name="task-content" id="task-content" class="form-input">
            <label for="date" class="form-label">Date</label>
            <input type="date" name="date" id="date" class="form-input">
            <label for="text-content" class="form-label">Tags</label>
            <div>
                <input type="checkbox" name="tag" id="tag-work" value="work">
                <label for="tag" class="form-label">Work</label>
                <input type="checkbox" name="tag" id="tag-personal" value="personal">
                <label for="tag" class="form-label">Personal</label>
            </div>
            <label for="status" class="form-label">Status</label>
            <input type="text" name="text" id="status" class="form-input" value="to-do" disabled>

            <button class="btn">Save Task</button>
        </form>
    </section>
    <script src="js/auth.js"></script>
    <script src="js/create-task.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
